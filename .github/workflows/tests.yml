name: data-quality-tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy plotly pytest
      - run: python -m pytest
      - run: python -m src.generate_demo --days 2
      - run: python -m src.etl --source demo
      - run: python -m src.build_report
